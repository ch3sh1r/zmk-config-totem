CONFIG_ZMK_USB_LOGGING=n

# Deep sleep: power the board down after 15 min idle to save battery.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Boost BLE transmit power for a more reliable split/host link.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Battery reporting. This is implied by CONFIG_ZMK_BLE, so it is already
# on by default -- stated explicitly here so the behavior is intentional.
# Set to n to stop reporting battery to the host entirely.
CONFIG_ZMK_BATTERY_REPORTING=y
# Report less often than the 60s default to reduce visible flicker from
# the XIAO BLE's noisy voltage-based estimate (cosmetic, not a recalibration).
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=120
# NOTE: the split peripheral (right half) battery is intentionally NOT
# proxied. CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY makes the
# central advertise multiple battery levels, which hosts (incl. BlueZ)
# handle inconsistently and is a likely source of the bad readings.
